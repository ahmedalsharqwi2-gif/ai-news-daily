name: PHP2Shell verified MEMES complete video (no publishing)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/php2shell_meme_review.py'
      - '.github/workflows/php2shell-meme-review.yml'
permissions:
  contents: read
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install free media dependencies
        run: |
          python -m pip install numpy pillow opencv-python-headless imageio-ffmpeg
          mkdir -p "$HOME/.local/bin"
          python - <<'PY'
          import imageio_ffmpeg,pathlib,os
          p=pathlib.Path.home()/'.local/bin/ffmpeg'
          p.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p.parent)+'\n')
          PY
      - name: Render verified PHP2Shell meme news with Charon voice
        run: PYTHONPATH=. python scripts/php2shell_meme_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEW-PHP2SHELL-MEMES-${{ github.run_id }}
          path: output/php2shell_meme/
          retention-days: 14
