name: Cloudflare photo review
'on':
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/cloudflare-review.yml
permissions:
  contents: write
concurrency:
  group: ai-news-daily
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Check configured secrets without revealing values
      run: 'python - <<''PY''

        import os

        needed=[''CLOUDFLARE_API_TOKEN'',''CLOUDFLARE_ACCOUNT_ID'',''GEMINI_API_KEY'']

        missing=[name for name in needed if not os.getenv(name,'''').strip()]

        if missing:raise SystemExit(''Missing Actions secrets: ''+'', ''.join(missing))

        print(''All three required secret names are configured; values are never printed.'')

        PY'
    - name: Install and preserve the tested photographic renderer
      run: "git clone --no-checkout https://github.com/ahmedalsharqwi2-gif/science-discovery-shorts.git /tmp/ai-photo-source\n\
        git -C /tmp/ai-photo-source checkout 933280fd26929eba42e7efce4c11723c5516649d\nfor item in news/images.py news/photo_render.py\
        \ news/produce.py tests/test_images.py news/editor.py tests/test_punchline.py README.md; do\n  cp \"/tmp/ai-photo-source/$item\"\
        \ \"$item\"\ndone\npython -m pip install requests beautifulsoup4 Pillow numpy\npython -m compileall -q news voice_provider\n\
        python -m unittest discover -s tests -v\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add news/images.py news/photo_render.py news/produce.py tests/test_images.py news/editor.py tests/test_punchline.py README.md\nif ! git diff --cached\
        \ --quiet; then\n  git commit -m 'Generate Cloudflare scene photographs and animate them with Charon narration'\n\
        \  git push origin HEAD:main\nfi"
    - uses: actions/cache/restore@v4
      with:
        path: '.voice_cache

          .image_cache

          state/api_budget.sqlite3

          state/news_history.json

          ~/.cache/huggingface'
        key: ai-news-state-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'ai-news-state-v2-${{ github.repository_id }}-

          ai-news-state-v1-${{ github.repository_id }}-'
    - uses: actions/cache/restore@v4
      with:
        path: '.work

          output/narration.wav

          output/narration.source.json

          output/timing.json'
        key: ai-news-photo-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ai-news-photo-checkpoint-${{ github.run_id }}-
    - name: Verify Cloudflare image generation before editorial production
      run: "python - <<'PY'\nimport os,hashlib\nfrom pathlib import Path\nimport requests\nfrom news.images import decoded_image,MODEL\n\
        p=Path('output/cloudflare-connection.jpg');p.parent.mkdir(exist_ok=True)\nif not p.exists():\n    account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()\n\
        \    token=os.environ['CLOUDFLARE_API_TOKEN'].strip()\n    response=requests.post(f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{MODEL}',headers={'Authorization':'Bearer\
        \ '+token},json={'prompt':'Photorealistic editorial illustration of a modern AI research laboratory, real computer\
        \ workstation and silicon processor on a table, amber practical light and cool teal monitors, realistic materials,\
        \ natural depth of field, strong center subject for vertical crop, no text, no logos, no charts, no cartoon.','steps':8},timeout=120)\n\
        \    decoded_image(response).save(p,quality=95)\nprint('Cloudflare actual image generated; sha256='+hashlib.sha256(p.read_bytes()).hexdigest())\n\
        PY"
    - name: Generate source-specific photographs through Cloudflare
      run: 'python - <<''PY''

        from news.editor import prepare

        from news.images import prepare_images

        plan=prepare()

        if plan is None:raise RuntimeError(''No fresh official source; no fabricated news'')

        images=prepare_images(plan)

        print(''Image connection verified:'',len(images),''actual generated scene images'')

        PY'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cloudflare-image-proof-${{ github.run_id }}
        path: 'output/images/

          output/image_manifest.json

          output/plan.json

          output/source.json

          output/editorial-review.json

          output/status.json

          output/cloudflare-connection.jpg'
        retention-days: 14
        if-no-files-found: warn
    - name: Install narration alignment and video dependencies
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg fonts-dejavu-core

        python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -r requirements.txt'
    - name: Render the complete Charon video with generated photographs
      run: python -m news.produce
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ai-news-photo-review-${{ github.run_id }}
        path: output/
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/cache/save@v4
      if: always()
      with:
        path: '.voice_cache

          .image_cache

          state/api_budget.sqlite3

          state/news_history.json

          ~/.cache/huggingface'
        key: ai-news-state-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/cache/save@v4
      if: always()
      with:
        path: '.work

          output/narration.wav

          output/narration.source.json

          output/timing.json'
        key: ai-news-photo-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
