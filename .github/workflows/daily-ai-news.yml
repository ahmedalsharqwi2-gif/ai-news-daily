name: ai على السريع
on:
  workflow_dispatch:
  schedule:
    - cron: '10 13 * * *'
      timezone: Africa/Cairo
  push:
    paths: ['news/**', 'voice_provider/**', 'config/**', 'tests/**', 'api_budget.py', 'requirements.txt', '.github/workflows/daily-ai-news.yml']
permissions:
  contents: read
concurrency:
  group: ai-news-daily
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4 Pillow
      - run: python -m compileall -q api_budget.py news voice_provider
      - run: python -m unittest discover -s tests -v
  produce:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.AI_NEWS_DAILY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache/restore@v4
        with:
          path: |
            .voice_cache
            .image_cache
            state/api_budget.sqlite3
            state/news_history.json
            ~/.cache/huggingface
          key: ai-news-state-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-news-state-v2-${{ github.repository_id }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            .work
            output/narration.wav
            output/narration.source.json
            output/timing.json
          key: ai-news-checkpoint-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-news-checkpoint-v3-${{ github.run_id }}-
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Produce a complete checked Charon video for review
        run: python -m news.produce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-news-daily-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .voice_cache
            .image_cache
            state/api_budget.sqlite3
            state/news_history.json
            ~/.cache/huggingface
          key: ai-news-state-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .work
            output/narration.wav
            output/narration.source.json
            output/timing.json
          key: ai-news-checkpoint-v3-${{ github.run_id }}-${{ github.run_attempt }}
