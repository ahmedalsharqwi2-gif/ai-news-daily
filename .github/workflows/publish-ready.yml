{
  "name": "Resume complete verified AI news publication",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_run": {
          "description": "Run containing a verified complete video",
          "type": "string",
          "default": "39690746788"
        }
      }
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/publish-ready.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "ai-news-daily",
    "cancel-in-progress": false
  },
  "jobs": {
    "resume": {
      "if": "${{ github.event_name != 'push' || github.event.head_commit.message == 'Publish the checked ready AI news episode' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "CHANNEL_BRAND": "ai على السريع",
        "PUBLICATION_RECEIPTS_ENABLED": "true",
        "BUFFER_SCHEDULE_MODE": "customScheduled",
        "PUBLISH_IMMEDIATE": "true",
        "PRODUCTION_MEDIA_ID": "approved-photo-v3-news",
        "SOURCE_RUN": "${{ inputs.source_run || '39690746788' }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "news-daily-cinema-${{ env.SOURCE_RUN }}",
            "run-id": "${{ env.SOURCE_RUN }}",
            "github-token": "${{ github.token }}",
            "path": ".resume"
          }
        },
        {
          "name": "Restore verified output and install publication dependencies",
          "run": "cp -a .resume/output ./output\nsudo apt-get update -qq\nsudo apt-get install -y ffmpeg\npython -m pip install requests numpy beautifulsoup4"
        },
        {
          "name": "Publish verified complete episode without generation",
          "run": "python -m film_factory.publish news"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "news-publication-receipts-${{ github.run_id }}",
            "path": "output/publication.json\noutput/publication-result.json\noutput/channel-discovery.json\nstate/publication_stock.json",
            "retention-days": 30
          }
        },
        {
          "name": "Preserve partial and complete publication receipts",
          "if": "always()",
          "run": "git config user.name content-bot\ngit config user.email bot@users.noreply.github.com\nif [ ! -f state/publication_stock.json ]; then exit 0; fi\ngit add state/publication_stock.json\nif git diff --cached --quiet; then exit 0; fi\ngit commit -m 'Persist checked AI news publication receipts [skip ci]'\ngit pull --rebase --autostash origin main\ngit push origin HEAD:main"
        }
      ]
    }
  }
}
