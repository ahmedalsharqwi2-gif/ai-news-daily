{
  "name": "Inspect exact retained episode; no generation or publishing",
  "on": {
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-inspect-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "jobs": {
    "inspect": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "run": "python -m pip install requests\npython -m production_v2.inspect_retained"
        }
      ]
    }
  }
}
