{
  "name": "Read-only dated news source probe",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-news-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "name": "Read actual official dated headlines; no model generation or publishing",
          "run": "python - <<'PY_NEWS'\nimport json\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nfrom news.editor import candidates\nfrom professional_motion.news_policy import require_fresh\nfrom production_v2.export_review import context,StatusStore\nrepository,run,attempt,source=context('news')\nrequest=json.loads(Path('.github/production-v2-news-request.json').read_text());assert request['read_only'] is True\nrows=candidates();history=json.loads(Path('state/professional_topics.json').read_text())['episodes']\nused={entry.get('url') or entry.get('story',{}).get('source',{}).get('url') for entry in history}\nresult=[]\nfor row in rows:\n try:require_fresh(row);fresh=True\n except (ValueError,TypeError):fresh=False\n result.append({**{key:row.get(key) for key in ('title','url','publisher','published')},'fresh_48h':fresh,'already_reserved':row['url'] in used})\nreport={'profile':'news','repository':repository,'run_id':run,'run_attempt':attempt,'source_commit':source,'stage':'success','read_only':True,'no_provider_calls':True,'no_posts_created':True,'checked_at':datetime.now(timezone.utc).isoformat(),'rows':result,'feed_status':json.loads(Path('output/feed-status.json').read_text())}\nStatusStore('.', 'codex/production-v2-news-sources').save(run,attempt,report)\nprint(json.dumps({'candidates':len(result),'unused_fresh':sum(row['fresh_48h'] and not row['already_reserved'] for row in result)}))\nPY_NEWS"
        }
      ]
    }
  }
}
