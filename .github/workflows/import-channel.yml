name: Import saved AI news channel
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/import-channel.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy the pinned public channel source
        run: |
          git clone --no-checkout https://github.com/ahmedalsharqwi2-gif/science-discovery-shorts.git /tmp/ai-news-source
          git -C /tmp/ai-news-source checkout 641b07efd0068cd64009062595b009aead84a07c
          for item in .gitignore README.md api_budget.py requirements.txt assets config news review tests voice_provider; do
            cp -a "/tmp/ai-news-source/$item" .
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text().replace('# AI كل يوم — Egyptian AI News','# ai على السريع — Egyptian AI News')
          text='\n'.join('1. هذا هو مستودع القناة المستقل: ai-news-daily.' if line.startswith('1. أنشئ مستودعًا فارغًا') else line for line in text.splitlines())
          text+='\n\n## Cloudflare image setup\nAdd GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for the planned image integration. The transferred renderer currently uses native motion graphics; image generation is not wired yet.\n'
          p.write_text(text)
          PY
      - name: Validate the transferred code without paid API calls
        run: |
          python -m pip install requests beautifulsoup4
          python -m compileall -q api_budget.py news voice_provider
          python -m unittest discover -s tests -v
      - name: Preserve the full channel in its own repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md api_budget.py requirements.txt assets config news review tests voice_provider
          if ! git diff --cached --quiet; then
            git commit -m 'Import ai على السريع channel from verified source 641b07e'
            git push origin HEAD:main
          fi
