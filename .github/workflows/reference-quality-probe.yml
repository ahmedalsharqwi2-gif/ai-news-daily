{
  "name": "Reference quality MP4 probe (no publishing)",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/reference-quality-probe.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "review": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install dependencies",
          "run": "sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core\npython -m pip install requests Pillow numpy beautifulsoup4\npython -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu\npython -m pip install -r film_factory/requirements.txt\npython -m pip install -r requirements.txt"
        },
        {
          "name": "Produce full fresh AI news MP4 with no publishing",
          "run": "python -m news.produce"
        },
        {
          "name": "Verify full decoded MP4",
          "run": "python scripts/verify_cinematic_delivery.py output/ai-news-daily.mp4 --max-duration 120"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "ai-news-reference-probe-${{ github.run_id }}",
            "path": "output/",
            "retentionDays": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}